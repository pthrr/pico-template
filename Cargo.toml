[package]
name = "pico-template"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5" }
embassy-sync = { version = "0.8" }

# RP2040 specific dependencies
embassy-rp = { version = "0.9", optional = true }
rp2040-boot2 = { version = "0.3", optional = true }

# STM32 specific dependencies
embassy-stm32 = { version = "0.6", features = ["stm32u585ai", "time-driver-any", "exti"], optional = true }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
portable-atomic = { version = "1.12", features = ["critical-section"] }
static_cell = "2.1"

[dev-dependencies]
defmt-test = "0.5"

[[test]]
name = "integration"
harness = false

[build-dependencies]
serde_json = "1.0"

[features]
default = ["pico1"]
pico1 = ["embassy-rp", "embassy-rp/rp2040", "embassy-rp/time-driver", "rp2040-boot2"]
pico2 = ["embassy-rp", "embassy-rp/rp235xa", "embassy-rp/time-driver"]
unoq = ["embassy-stm32"]
[[bin]]
name = "pico-template"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = "s"
incremental = false
codegen-units = 1
debug = true

[profile.test]
opt-level = "s"
debug = true
