[package]
name = "pico-template"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5" }
embassy-sync = { version = "0.7" }

# RP2040 specific dependencies
embassy-rp = { version = "0.9", optional = true }
rp2040-boot2 = { version = "0.3", optional = true }

# STM32 specific dependencies
embassy-stm32 = { version = "0.5", features = ["stm32u585ai", "time-driver-any", "exti"], optional = true }

# Optional display support (ratatui on SPI LCD)
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "portable-atomic"], optional = true }
mousefood = { version = "0.4", default-features = false, features = ["fonts"], optional = true }
embedded-graphics = { version = "0.8", optional = true }
mipidsi = { version = "0.9", optional = true }
embedded-alloc = { version = "0.7", optional = true }
embedded-hal-bus = { version = "0.3", features = ["defmt-03"], optional = true }

embedded-hal = { version = "1.0", optional = true }

# Optional bootloader support (firmware update via USB/UART)
embassy-usb = { version = "0.5", optional = true }
embedded-io-async = { version = "0.7", optional = true }
crc = { version = "3.2", default-features = false, optional = true }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
portable-atomic = { version = "1.12", features = ["critical-section"] }
static_cell = "2.1"

[dev-dependencies]
defmt-test = "0.4"

[[test]]
name = "integration"
harness = false

[build-dependencies]
serde_json = "1.0"

[features]
default = ["pico1"]
pico1 = ["embassy-rp", "embassy-rp/rp2040", "embassy-rp/time-driver", "rp2040-boot2"]
pico2 = ["embassy-rp", "embassy-rp/rp235xa", "embassy-rp/time-driver"]
unoq = ["embassy-stm32"]
display = ["ratatui", "mousefood", "embedded-graphics", "mipidsi", "embedded-alloc", "embedded-hal-bus", "embedded-hal"]
display-st7789 = ["display"]
display-ili9341 = ["display"]
bootloader = ["crc", "embedded-io-async"]
bootloader-rp = ["bootloader", "embassy-usb"]

[[bin]]
name = "pico-template"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = "s"
incremental = false
codegen-units = 1
debug = true

[profile.test]
opt-level = "s"
debug = true
