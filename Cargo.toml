[package]
name = "pico-template"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "external/base", default-features = false }
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.3" }
embassy-sync = { version = "0.7" }

# RP2040 specific dependencies
embassy-rp = { version = "0.9", features = ["time-driver"], optional = true }
rp2040-boot2 = { version = "0.3", optional = true }

# STM32 specific dependencies
embassy-stm32 = { version = "0.5", features = ["stm32u585ai", "time-driver-any", "exti"], optional = true }

# Optional USB support
embassy-usb = { version = "0.5", optional = true }

embedded-hal = "1.0"
embedded-hal-async = "1.0"

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
critical-section = "1.1"
atomic-polyfill = "1.0"

serde = { version = "1.0", default-features = false, features = ["derive"] }
heapless = "0.8"
portable-atomic = { version = "1.12", features = ["critical-section"] }
static_cell = "2.1"

# Ferrous Systems / Knurling-rs crates
postcard = { version = "1.0", default-features = false }

[dev-dependencies]
defmt-test = "0.4"

[[test]]
name = "integration"
harness = false

[build-dependencies]
serde_json = "1.0"
flip-link = "0.1"

[features]
default = ["pico1"]
pico1 = ["embassy-rp", "rp2040-boot2"]
pico2 = ["embassy-rp", "rp2040-boot2"]
stm32u585 = ["embassy-stm32"]
uno_q = ["embassy-stm32"]
usb = ["embassy-usb"]

[[bin]]
name = "pico-template"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = "s"
incremental = false
codegen-units = 1
debug = true

[profile.test]
opt-level = "s"
debug = true
